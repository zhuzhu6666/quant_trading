# nginx.example.conf — quant API production reverse proxy
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/quant.conf
#   2. Replace `quant.example.com` with your domain
#   3. Symlink to /etc/nginx/sites-enabled/quant.conf
#   4. Obtain TLS certs (acme.sh example below)
#   5. nginx -t && systemctl reload nginx
#
# Backend uvicorn must be running on 127.0.0.1:8000.
# Current frontend is WeChat mini-program V2. `/mobile/` exposes small H5 pages
# used by web-view, including the TradingView-style PnL chart.

# ── Rate-limit zone (defined at http level) ──
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# ── Upstream (uvicorn) ──
upstream quant_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name quant.example.com;

    # ACME http-01 challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quant.example.com;

    # ── TLS (Let's Encrypt via acme.sh) ──
    # Example: /root/.acme.sh/acme.sh --issue -d quant.example.com --nginx
    # Then symlink the issued certs to these paths.
    ssl_certificate     /etc/letsencrypt/quant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/quant.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logging ──
    access_log /var/log/nginx/quant.access.log;
    error_log  /var/log/nginx/quant.error.log warn;

    # ── Body size limit (config PUT uploads yaml, factor reports are small) ──
    client_max_body_size 10m;

    # ── Mobile H5 pages for WeChat web-view ──
    # Replace this path with the checked-out repo path on the server.
    location /mobile/ {
        alias /opt/quant_trading/server_static/mobile/;
        try_files $uri $uri/ =404;
    }

    location /vendor/ {
        alias /opt/quant_trading/server_static/vendor/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── API routes: rate-limited + reverse-proxied to uvicorn ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://quant_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Brute-force protection on login ──
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://quant_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket: critical for /ws/state (1s state tick) ──
    location /ws/ {
        proxy_pass http://quant_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts — WS connections should stay open indefinitely
        proxy_connect_timeout 7s;
        proxy_send_timeout    3600s;   # 1 hour
        proxy_read_timeout    3600s;   # 1 hour
        proxy_buffering       off;     # stream WS frames immediately
    }

    # ── API-only root ──
    location / {
        return 404;
    }
}
