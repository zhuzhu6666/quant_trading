system:
  mode: live
  clock: realtime
  log_level: INFO
  log_dir: logs/
features:
  # Release-time only. These values are not part of RuntimeConfig and cannot
  # be changed by autonomous governance or the generic config API.
  live_safety_plane_v2_mode: shadow
  live_generation_controller_v2_enabled: false
  ctrader_execution_outcome_v2_enabled: false
  governance_mutation_coordinator_v2_mode: dual_record
  pg_job_queue_v2_enabled: false
ctrader:
  client_id_env: CTRADER_CLIENT_ID
  client_secret_env: CTRADER_CLIENT_SECRET
  access_token_env: CTRADER_ACCESS_TOKEN
  account_id_env: CTRADER_ACCOUNT_ID
  host: demo.ctraderapi.com
  port: 5035
  symbol: XAUUSD
  proxy_url: ''
  proxy_rdns: true
  rate_limit_per_sec: 5
  request_timeout_sec: 10
  send_orders: true
commission:
  type: fixed
  value: 6.0
risk:
  max_daily_loss_pct: 50.0
  max_position_lots: 0.5
  max_trades_per_day: 100
  single_trade_risk_usd: 2.0
  circuit_breaker:
    consecutive_losses: 5
    slippage_pct: 0.5
    volatility_mult: 3.0
position:
  sizing_method: kelly
  risk_per_trade_pct: 2.0
  max_position_lots: 0.1
  max_leverage: 500
event_sizing:
  enabled: true
  db_path: data/events.duckdb
  event_times:
    FOMC: '19:00'
    NFP: '13:30'
    CPI: '13:30'
    PCE: '13:30'
  tiers:
    3:
    - max_hours_before: 0.25
      multiplier: 0.5
    - max_hours_before: 1
      multiplier: 0.8
    2:
    - max_hours_before: 0.5
      multiplier: 1.0
execution:
  default_type: market
  slippage_model: fixed
  slippage_value: 0.02
  retry_attempts: 3
  retry_delay_ms: 500
  timeout_seconds: 10
data:
  store_backend: duckdb
  db_path: data/ctrader_data.duckdb
  tick_buffer_size: 10000
  bar_timeframes:
  - M5
  - M15
  - M30
  - H1
  - H4
  - D1
  warmup_bars: 500
alpha:
  factor_decay_hours: 24
  min_ic_threshold: 0.02
  rolling_window_days: 20
runtime:
  shadow_vote_weight: 0.15
  shadow_top_k: 3
  shadow_recompute_every: 8
  shadow_rank_window: 50
  shadow_min_samples: 30
  shadow_top_pct: 0.7
  shadow_bottom_pct: 0.3
  factor_health_healthy_threshold: 70.0
  factor_health_watch_threshold: 40.0
  factor_health_min_n_obs: 100
  factor_health_ic_active_threshold: 0.02
  factor_health_decay_window_q: 4
  gp_pop_size: 50
  gp_n_generations: 20
  gp_elite_frac: 0.1
  gp_tournament_k: 3
  gp_mut_prob_subtree: 0.1
  gp_mut_prob_const: 0.05
  gp_max_runtime_sec: 600.0
  discover_n_bars: 8000
  discover_top_k: 10
  discover_score_threshold: 50.0
  discover_n_warmstart: 20
  retire_decaying_days: 7
  retire_grace_hours_severe: 24
  retire_grace_hours_mild: 72
  retire_severe_threshold: 30.0
  canary_min_oos_bars: 80
  canary_min_oos_pnl: 0.0
  canary_min_unreliable_count: 0
  drift_n_bars: 5000
  drift_pop: 50
  drift_gen: 30
  drift_research_cooldown_sec: 3600
  retrain_every_n_trades: 200
  retrain_min_trades_before_first: 100
  retrain_timeout_sec: 300
  scheduler_auto_discover_cron: 0 1 * * *
  scheduler_promote_cron: 30 1 * * *
  scheduler_drift_research_interval_min: 15
  scheduler_dryrun_cron: 0 2 * * *
  scheduler_timezone: UTC
  sync_interval_sec: 300
  sync_recovery_max_attempts: 3
  ctrader_send_orders: true
  risk_sl_atr: 1.5
  risk_tp_atr: 2.5
  risk_max_drawdown_pct: 15.0
  risk_max_consecutive_losses: 8
  risk_max_daily_loss_pct: 50.0
  risk_max_daily_trades: 100
  risk_data_lag_max_seconds: 3600.0
  risk_circuit_breaker_bypass: false
  risk_cooldown_bars: 3
  risk_loss_cooldown_after_losses: 2
  risk_loss_cooldown_bars: 3
  risk_supervisor_reentry_cooldown_bars: 3
  risk_supervisor_reentry_block_reduce: true
  risk_max_holding_bars: 288
  risk_block_on_disk_critical: true
  risk_enable_nfp_skip: false
  risk_enable_gvz_gate: false
  risk_gvz_drop_pct: -2.0
  position_supervisor_template_id: position_supervisor:default.v1
  autonomy_mode: demo_autonomous
  autonomy_demo_auto_apply: true
  live_autonomy_unlocked: false
  live_autonomy_unlock_id: ''
  demo_learning_max_daily_trades: 100
  # Fail-closed default for non-demo/live authority. Demo nursery/autonomous
  # keeps governed exploration active through RuntimeConfig mode semantics.
  autonomy_expansion_frozen: true
  # Operator-owned all-mode governance expansion kill switch. Observation,
  # research and explicit risk tightening remain available while paused.
  governance_expansion_paused: false
  supervisor_counterfactual_governance_horizon_minutes: 60
  supervisor_counterfactual_full_horizon_minutes: 120
  supervisor_canary_mature_trade_count: 50
  learning_effect_inconclusive_after_days: 7
  nursery_exploration_per_reason_daily_limit: 5
  nursery_exploration_global_daily_limit: 15
  nursery_exploration_setup_daily_limit: 1
  nursery_exploration_reservation_ttl_seconds: 300
  supervisor_min_stop_distance_points: 0.20
  supervisor_stop_safety_buffer_ratio: 0.00008
  supervisor_min_tighten_delta_points: 0.01
  supervisor_quote_max_age_seconds: 10.0
  entry_edge_uncertainty_atr_ratio: 0.10
  runtime_incident_mode: normal
  strategy_sl_atr: 2.0
  strategy_tp_atr: 3.0
  strategy_cooldown_bars: 3
  evaluation_embargo_bars: 288
