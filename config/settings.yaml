# =============================================================================
# Global Settings — 配置文件
# =============================================================================

system:
  mode: backtest             # backtest | paper | live
  clock: realtime            # realtime | simulated
  log_level: INFO
  log_dir: logs/

# cTrader Open API (唯一执行通道, MT5 已移除)
# Pepperstone demo 走 demo.ctraderapi.com:5035 (ssl)
# Access token (推荐) 走 env: CTRADER_ACCESS_TOKEN, 不需 password
ctrader:
  client_id_env: CTRADER_CLIENT_ID
  client_secret_env: CTRADER_CLIENT_SECRET
  access_token_env: CTRADER_ACCESS_TOKEN    # Pepperstone demo 提供
  account_id_env: CTRADER_ACCOUNT_ID
  host: demo.ctraderapi.com                  # demo=模拟盘, live=实盘 host
  port: 5035
  symbol: XAUUSD                            # Pepperstone 是 XAUUSD (无 +)
  rate_limit_per_sec: 5                     # 跟 SDK 默认对齐, 防 broker 限速
  request_timeout_sec: 10
  send_orders: false                        # 安全闸: PoC 阶段默认不下单

  
commission:
  type: fixed                 # fixed | percentage
  value: 6.0                  # $6/lot

risk:
  max_daily_loss_pct: 5.0     # 日内最大亏损
  max_position_lots: 0.5      # 最大持仓
  max_trades_per_day: 20      # 日内最大交易次数
  single_trade_risk_usd: 2.0  # 单笔最大亏损
  circuit_breaker:
    consecutive_losses: 5     # 连续亏损N笔→熔断
    slippage_pct: 0.5         # 滑点超N%→熔断
    volatility_mult: 3.0      # ATR×N→减仓

position:
  sizing_method: kelly          # risk_fixed | kelly | equal
  risk_per_trade_pct: 2.0       # 每笔风险占资金%
  max_position_lots: 0.1        # 最大仓位手数
  max_leverage: 500             # Bybit最大杠杆

event_sizing:
  enabled: true                 # 事件感知动态仓位
  db_path: data/ctrader_data.duckdb
  event_times:                  # 假设发布时间 (UTC)
    FOMC: "19:00"
    NFP: "13:30"
    CPI: "13:30"
    PCE: "13:30"
  tiers:                        # importance → [{max_hours_before, multiplier}]
    3:  # HIGH: FOMC, NFP, CPI
      - {max_hours_before: 4,  multiplier: 0.2}
      - {max_hours_before: 24, multiplier: 0.5}
      - {max_hours_before: 72, multiplier: 0.8}
    2:  # MEDIUM: PCE
      - {max_hours_before: 4,  multiplier: 0.5}
      - {max_hours_before: 24, multiplier: 0.8}

execution:
  default_type: market         # market | limit | stop
  slippage_model: fixed        # fixed | percentage | adaptive
  slippage_value: 0.02         # 2bps
  retry_attempts: 3
  retry_delay_ms: 500
  timeout_seconds: 10

data:
  store_backend: duckdb           # duckdb | sqlite
  db_path: data/ctrader_data.duckdb
  tick_buffer_size: 10000
  bar_timeframes: [M5, M15, M30, H1, H4, D1]
  warmup_bars: 500

alpha:
  factor_decay_hours: 24       # IC衰减周期
  min_ic_threshold: 0.02       # 最低IC阈值
  rolling_window_days: 20      # IC滚动窗口

monitor:
  dashboard_port: 8050
  websocket_port: 8051
  alert_channels: [log]         # log | dingtalk | wechat
  metrics_interval_seconds: 1

# =============================================================================
# RuntimeConfig (Phase 1.2) — 可热更新字段
# 运行中任何修改通过 POST /api/control/runtime/reload 推送给所有 loop
# 缺失字段使用 config/runtime_config.py 中的默认值
# =============================================================================
runtime:
  # --- 影子因子 ---
  shadow_vote_weight: 0.15
  shadow_top_k: 3
  shadow_recompute_every: 8
  shadow_rank_window: 50
  shadow_min_samples: 30

  # --- 因子健康 ---
  factor_health_healthy_threshold: 70.0
  factor_health_watch_threshold: 40.0
  factor_health_min_n_obs: 100
  factor_health_ic_active_threshold: 0.02

  # --- Canary ---
  canary_min_oos_bars: 80
  canary_min_oos_pnl: 0.0
  canary_min_unreliable_count: 0

  # --- 退役 ---
  retire_decaying_days: 7
  retire_grace_hours_severe: 24
  retire_grace_hours_mild: 72
  retire_severe_threshold: 30.0

  # --- 调度 ---
  scheduler_auto_discover_cron: "0 1 * * *"
  scheduler_promote_cron: "30 1 * * *"
  scheduler_drift_research_interval_min: 15
  scheduler_dryrun_cron: "0 2 * * *"
  scheduler_timezone: "UTC"

  # --- 数据自给 ---
  sync_interval_sec: 300
  sync_recovery_max_attempts: 3
  strategy_sl_atr: 2.0
  strategy_tp_atr: 3.0
  strategy_cooldown_bars: 3
  # 以下字段对应 RuntimeConfig dataclass 无定义, 保留仅作参考
  # strategy_bb_percentile: 80
  # strategy_nfp_skip_days: 1
  # strategy_enable_dual_event_skip: false
  # strategy_enable_fomc_boost: false
  # strategy_fomc_boost_mult: 1.5
  # strategy_enable_gvz_gate: false
  # strategy_gvz_drop_pct: -2.0

  # --- Phase 5: 风控升级 (默认启用) ---
  var_enabled: true
  var_cvar_threshold: 0.02
  kelly_enabled: true
  kelly_fraction: 0.5
  kelly_max_pct: 0.25
  kelly_risk_per_trade_pct: 0.01

