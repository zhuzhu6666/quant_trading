# =============================================================================
# Instrument Registry — 品种参数
# =============================================================================

XAUUSD+:
  name: "Spot Gold vs USD"
  type: spot
  pip_value: 1.0               # $1/pip for 1 lot
  contract_size: 100            # 100 oz/lot
  min_lot: 0.01
  max_lot: 10.0
  lot_step: 0.01
  digits: 2
  tick_size: 0.01
  stop_level: 10                # 最小止盈止损距离(points)
  freeze_level: 0
  margin_rate: 0.002            # 0.2% = 500x leverage
  
  trading_hours:
    - [monday, "00:00", "23:59"]
    - [tuesday, "00:00", "23:59"]
    - [wednesday, "00:00", "23:59"]
    - [thursday, "00:00", "23:59"]
    - [friday, "00:00", "21:59"]
  
  # 日内波动特征 (H1, from 3-year data)
  volatility:
    atr_14_median: 15.0         # ~$15 ATR on H1
    daily_range_pct: 0.5        # ~0.5% daily range
    
  # 流动性特征
  liquidity:
    spread_typical: 0.02        # 2bps typical
    spread_widened: 0.10        # news events
    slippage_factor: 1.5        # 实际滑点 = 理论 × 1.5
