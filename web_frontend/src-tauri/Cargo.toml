[package]
name = "quant-workbench"
version = "0.1.0"
description = "Quant Trading Workbench desktop shell"
authors = ["Quant Trading"]
edition = "2021"

[lib]
name = "quant_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
