version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # DuckDB 数据和 charts 持久化
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
      # 配置热更新（不改容器）
      - ./config:/app/config
      # cTrader 凭证（不上传到镜像，只运行时挂载）
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONIOENCODING=utf-8:replace
    # 如果 cTrader 凭证不在 .env 里，也可以用环境变量传
    # env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
