# =============================================================================
# Quant Trading Backend — Docker Compose
#
# Architecture:
#   MT5 data source runs on the Windows HOST (MT5Puller writes data/volume).
#   This container runs the FastAPI backend + cTrader execution + factor pipeline.
#
# Usage:
#   Production (Linux server):  docker compose up -d
#   Dev (Windows):              python start-all.py  (MT5 + backend run locally)
#
# Required .env entries:
#   CTRADER_CLIENT_ID
#   CTRADER_CLIENT_SECRET
#   QUANT_JWT_SECRET            (falls back to "changeme" if omitted)
#   QUANT_CORS_ALLOWED_ORIGINS  (optional, comma-separated origins)
# =============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Shared data directory — MT5 on host writes to this; container reads
      - ./data:/app/data
      # Config (runtime config files, if any)
      - ./config:/app/config
      # Logs persist outside the container
      - ./logs:/app/logs
      # Environment file (must contain broker credentials)
      - ./.env:/app/.env:ro
    environment:
      # JWT secret for web console auth
      - QUANT_JWT_SECRET=${QUANT_JWT_SECRET:-changeme}
      # CORS origins for dev-mode Vite (default: localhost:5173)
      - QUANT_CORS_ALLOWED_ORIGINS=${QUANT_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Container timezone
      - TZ=UTC
    restart: unless-stopped
    # Optional: resource limits
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
