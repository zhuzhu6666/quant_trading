<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>系统收益曲线</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <div class="kicker">TradingView Lightweight Charts</div>
          <h1>系统收益曲线</h1>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button">刷新</button>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <span>当前系统权益</span>
          <strong id="equityValue">--</strong>
        </div>
        <div class="stat-card">
          <span>累计盈利</span>
          <strong id="pnlValue">--</strong>
        </div>
        <div class="stat-card">
          <span>历史平仓</span>
          <strong id="tradesValue">--</strong>
        </div>
        <div class="stat-card">
          <span>胜率</span>
          <strong id="winRateValue">--</strong>
        </div>
      </section>

      <section class="chart-shell">
        <div class="chart-head">
          <div>
            <div class="chart-title">累计盈利 PnL</div>
            <div id="chartSub" class="chart-sub">初始资金 500.00</div>
          </div>
          <div class="range-tabs">
            <button class="range-tab" data-range="50" type="button">50</button>
            <button class="range-tab active" data-range="120" type="button">120</button>
            <button class="range-tab" data-range="all" type="button">全部</button>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div id="legend" class="legend">拖动平移，双指缩放，点按查看十字线</div>
        <div id="empty" class="empty" hidden>暂无历史平仓记录</div>
      </section>

      <section class="trade-list">
        <div class="list-head">
          <span>最近平仓</span>
          <span>单笔 / 累计 / 权益</span>
        </div>
        <div id="recentTrades"></div>
      </section>
    </main>

    <script src="/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
    <script src="./pnl-chart.js"></script>
  </body>
</html>
